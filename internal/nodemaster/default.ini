[default]
;
;socket address that NodeMaster will listen
;
addr = :8080

;
;the appname will use "NodeMaster" if leave blank
;
appname = NodeMaster

[firewall]
; following three options value are supported.
; allow_only
; allow_all
;
; the mode will use allow_all if mode leave blank.
fwMode = allow_only
AllowOnlyHosts = 127.0.0.1;192.168.1.3;192.168.1.28

[tls]
TlsCertFile =  n:/tmp/test.crt
TlsKeyFile = n:/tmp/test.key


