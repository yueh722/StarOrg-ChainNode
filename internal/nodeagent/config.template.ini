[global]

;websocket address of NodeMaster
ServerAddr = ws://localhost:8080/websocket

;binary directory of cometbft node and ABCI app
BinDir = N:\cometbft\bin

;default parent data directory of node running by this NodeAgent
;if node section has HomeDir, HomeDir of the node will be override
HomeDir = N:\cometbft\

;unique identity of current computer based on mac address or physical feature. won't changed even reinstalled.
;readonly once written
DeviceId =

;use single if leave blank
;multi: create a standalone process for each node.
;single: create a go-routine for each node.
launcherModel = multi

;
;a flag that indicates if restart process while node and app exited.
RestartOnNodeExited = false


[node1]
;unique identity of node running by this NodeAgent
AppName = node1
;data directory of node running by this NodeAgent
HomeDir = N:\cometbft1\

[node2]
AppName = node2

[node3]
AppName = node3

[node4]
AppName = node4
